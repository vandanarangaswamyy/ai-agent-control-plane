[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-control-plane-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Agent Control Plane."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.3",
    "celery[redis]>=5.4.0",
    "fastapi>=0.115.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "prometheus-client>=0.25.0",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "redis>=5.1.1",
    "sqlalchemy>=2.0.35",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.30.6",
]

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
